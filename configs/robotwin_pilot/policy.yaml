defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:RECAP_GPU,1}

runner:
  task_type: sft
  logger:
    project_name: rlinf
    logger_backends: [tensorboard]
    log_path: ${oc.env:PROJECT_ROOT}/.runtime/runs
    experiment_name: recap-pilot-policy
  max_steps: 500
  max_epochs: -1
  val_check_interval: -1
  save_interval: 100

data:
  num_workers: 2
  balance_dataset_weights: true
  seed: 42
  advantage_tag: pilot
  train_data_paths:
    - dataset_path: ${oc.env:PROJECT_ROOT}/datasets/lerobot/recap-pilot-v2/sft-train
      type: sft
      weight: 1.0
    - dataset_path: ${oc.env:PROJECT_ROOT}/datasets/lerobot/recap-pilot-v2/rollout-train
      type: rollout
      weight: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  seed: 0
  micro_batch_size: 2
  global_batch_size: 16
  model:
    model_path: ${oc.env:PROJECT_ROOT}/models/pi0.5_robotwin2
    num_action_chunks: 32
    action_dim: 14
    num_steps: 10
    openpi:
      config_name: pi05_aloha_robotwin
      action_horizon: 32
      max_token_len: 200
      discrete_state_input: true
      num_images_in_input: 3
      action_chunk: 32
      action_env_dim: 14
      train_expert_only: true
      guidance_type: positive
      cfgrl_guidance_scale: 1.0
      positive_only_conditional: true
      unconditional_prob: 0.1
    openpi_data:
      norm_stats_path: ${oc.env:PROJECT_ROOT}/models/pi0.5_robotwin2/assets/pi0.5_clean_randomize_joint_training/norm_stats.json
      adapt_to_pi: true
      extra_delta_transform: true
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 20
    total_training_steps: ${runner.max_steps}
    min_lr: 0.0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false

algorithm:
  adv_type: gae
reward:
  use_reward_model: false
critic:
  use_critic_model: false
