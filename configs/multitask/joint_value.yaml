defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:M2_GPU,0}
runner:
  task_type: sft
  max_epochs: -1
  max_steps: 2
  val_check_interval: -1
  save_interval: 2
  logger:
    log_path: ${oc.env:PROJECT_ROOT}/.runtime/runs/method/m2-interface-v1
    project_name: multitask-joint-development
    experiment_name: ${actor.model.mode}-seed${actor.seed}
    logger_backends: [tensorboard]
data:
  pool_path: ${oc.env:PROJECT_ROOT}/.runtime/datasets/method-m1-v1
  pool_manifest_sha256: b8c3c1f04e389caef7ba80d5dd762afe36abe8047e83a402e83f21188c56bbf3
  train_data_paths: [live-boundary-chunks]
actor:
  group_name: M2-${actor.model.mode}-${actor.seed}
  training_backend: fsdp
  seed: 0
  micro_batch_size: 1
  global_batch_size: 2
  model:
    model_type: mt_joint_prefix
    model_path: ${oc.env:PROJECT_ROOT}/models/pi0.5_robotwin2
    precision: fp32
    is_lora: false
    pool_path: ${data.pool_path}
    init_seed: ${actor.seed}
    mode: w1
    value_weight: 0.1
    adapter_rank: 32
    head_width: 63
    readout: vision_prompt_concat
  optim:
    lr: 0.0003
    value_lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 0
    total_training_steps: ${runner.max_steps}
    min_lr: 0.0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
algorithm:
  adv_type: gae
reward:
  use_reward_model: false
critic:
  use_critic_model: false
