defaults:
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config
cluster:
  num_nodes: 1
  component_placement:
    actor: 0
runner:
  task_type: sft
  logger:
    log_path: ${oc.env:VLA_ROOT}/.runtime/runs/manual
    project_name: robotwin_mtrl
    experiment_name: bc
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 1000
  val_check_interval: -1
  save_interval: 100
  resume_dir: null
data:
  train_data_paths: ${oc.env:VLA_ROOT}/.data/robotwin/manifest.json
  tasks: [adjust_bottle, handover_block]
  num_workers: 0
actor:
  group_name: ActorGroup
  training_backend: fsdp
  seed: 0
  micro_batch_size: 2
  global_batch_size: 16
  model:
    model_type: mtrl_frozen_pi0
    model_path: ${oc.env:VLA_ROOT}/.model/pi0_robotwin
    precision: fp32
    pi05: false
    num_action_chunks: 5
    action_dim: 14
    openpi:
      task: sft
      config_name: pi0_aloha_robotwin
      num_images_in_input: 3
      embed_dtype: bf16
      torch_compile: false
    openpi_data:
      norm_stats_path: ${oc.env:VLA_ROOT}/.data/robotwin/manifest.norm_stats.json
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 100
    total_training_steps: 1000
    min_lr: null
    min_lr_rate: 0.1
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false
