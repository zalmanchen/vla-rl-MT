# Predeclared evaluation: two seeds x 50 episodes, Task 0 only.
# Run once per seed. Ten envs x five fixed-horizon rollout epochs = 50.
runner:
  logger:
    log_path: ${oc.env:PROJECT_ROOT}/.runtime/runs/recap-official
    experiment_name: native-eval
env:
  eval:
    task_id_filter: [0]
    use_ordered_reset_state_ids: true
    total_num_envs: 10
    rollout_epoch: 5
    seed: 0
    video_cfg:
      save_video: false
rollout:
  model:
    model_path: ???
    num_action_chunks: 10
    openpi:
      task: eval
      config_name: pi05_libero
      discrete_state_input: false
    openpi_data:
      norm_stats_path: ${oc.env:PROJECT_ROOT}/.runtime/recap-official/assets/physical-intelligence/libero/norm_stats.json
